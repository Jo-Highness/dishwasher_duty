claim:
  name: Claim
  description: Claim the currently open cycle for one person.
  fields:
    person:
      name: Person
      description: Person entity ID (person.mia), its slug (mia) or display name (Mia).
      required: true
      example: person.mia
      selector:
        entity:
          domain: person
    config_entry_id:
      name: Dishwasher
      description: >-
        Optional - the Dishwasher Duty entry to use. Required for statistics
        when several dishwashers are set up.
      required: false
      selector:
        config_entry:
          integration: dishwasher_duty

claim_multiple:
  name: Claim (multiple)
  description: Claim the open cycle for several people at once (credit shared equally).
  fields:
    persons:
      name: Persons
      description: List of persons (entity ID, slug or display name).
      required: true
      example: "[person.mia, person.ben]"
      selector:
        entity:
          domain: person
          multiple: true
    config_entry_id:
      name: Dishwasher
      description: >-
        Optional - the Dishwasher Duty entry to use. Required for statistics
        when several dishwashers are set up.
      required: false
      selector:
        config_entry:
          integration: dishwasher_duty

cancel_claim:
  name: Cancel claim
  description: Withdraw a person's claim while the claim window is still open.
  fields:
    person:
      name: Person
      description: Person entity ID (person.mia), its slug (mia) or display name (Mia).
      required: true
      example: person.mia
      selector:
        entity:
          domain: person
    config_entry_id:
      name: Dishwasher
      description: >-
        Optional - the Dishwasher Duty entry to use. Required for statistics
        when several dishwashers are set up.
      required: false
      selector:
        config_entry:
          integration: dishwasher_duty

get_statistics:
  name: Get statistics
  description: Return structured unload statistics for a time range (service response).
  fields:
    start:
      name: Start
      description: Start of the range (inclusive). Omit for "from the beginning".
      required: false
      selector:
        datetime:
    end:
      name: End
      description: End of the range (inclusive). Omit for "until now".
      required: false
      selector:
        datetime:
    person:
      name: Person
      description: Optional - limit the per-person breakdown to one person.
      required: false
      selector:
        entity:
          domain: person
    config_entry_id:
      name: Dishwasher
      description: >-
        Optional - the Dishwasher Duty entry to use. Required for statistics
        when several dishwashers are set up.
      required: false
      selector:
        config_entry:
          integration: dishwasher_duty

reset_statistics:
  name: Reset statistics
  description: >-
    Reset stored cycle history. Without a person ALL history and credits are
    cleared; with a person only that person's claims/credits are removed.
  fields:
    person:
      name: Person
      description: Optional - reset only this person's data.
      required: false
      selector:
        entity:
          domain: person
    config_entry_id:
      name: Dishwasher
      description: >-
        Optional - the Dishwasher Duty entry to use. Required for statistics
        when several dishwashers are set up.
      required: false
      selector:
        config_entry:
          integration: dishwasher_duty
